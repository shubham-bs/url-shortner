<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>My URLs · Short.</title>
</head>

<body>

<div layout:fragment="content">

    <div class="dashboard">


        <!-- HEADER -->

        <div class="dashboard-header">

            <div class="dashboard-title">

                <h1>My URLs</h1>

                <p>
                    Manage the links you've created.
                </p>

            </div>

        </div>


        <!-- EMPTY STATE -->

        <div
                th:if="${shortUrls.data.isEmpty()}"
                class="empty-state">

            <div class="empty-state-title">
                You haven't created any short URLs yet.
            </div>

            <div class="empty-state-text">
                Create your first link from the homepage.
            </div>

        </div>


        <!-- URL TABLE -->

        <div
                th:unless="${shortUrls.data.isEmpty()}"
                class="table-container">

            <form
                    id="deleteForm"
                    th:action="@{/delete-urls}"
                    method="post">


                <div class="table-actions">

                    <button
                            type="button"
                            id="deleteSelectedBtn"
                            class="delete-button"
                            disabled>
                        Delete selected
                    </button>

                </div>


                <table class="url-table">

                    <thead>

                    <tr>

                        <th style="width: 42px;">

                            <input
                                    type="checkbox"
                                    id="selectAll"
                                    class="checkbox">

                        </th>

                        <th>Short URL</th>

                        <th>Original URL</th>

                        <th>Created</th>

                        <th>Expires</th>

                        <th>Visibility</th>

                        <th>Clicks</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="url : ${shortUrls.data}">

                        <td>

                            <input
                                    type="checkbox"
                                    name="ids"
                                    th:value="${url.id}"
                                    class="checkbox url-checkbox">

                        </td>


                        <td>

                            <a
                                    class="short-link"
                                    th:href="@{/s/{key}(key=${url.shortKey})}"
                                    th:text="${baseUrl + '/s/' + url.shortKey}"
                                    target="_blank">
                            </a>

                        </td>


                        <td>

                            <a
                                    class="original-link"
                                    th:href="${url.originalUrl}"
                                    th:text="${#strings.abbreviate(url.originalUrl, 50)}"
                                    target="_blank">
                            </a>

                        </td>


                        <td class="table-muted"
                            th:text="${#temporals.format(url.createdAt, 'yyyy-MM-dd HH:mm')}">
                        </td>


                        <td class="table-muted"
                            th:text="${url.expiresAt != null ? #temporals.format(url.expiresAt, 'yyyy-MM-dd HH:mm') : 'Never'}">
                        </td>


                        <td>

                            <span
                                    th:if="${url.private}"
                                    class="badge badge-private">
                                Private
                            </span>

                            <span
                                    th:unless="${url.private}"
                                    class="badge badge-public">
                                Public
                            </span>

                        </td>


                        <td class="table-muted"
                            th:text="${url.clickCount}">
                        </td>

                    </tr>

                    </tbody>

                </table>

            </form>


            <div th:insert="~{pagination}"></div>

        </div>

    </div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const selectAllCheckbox =
                document.getElementById("selectAll");

            const urlCheckboxes =
                document.querySelectorAll(".url-checkbox");

            const deleteButton =
                document.getElementById("deleteSelectedBtn");

            const deleteForm =
                document.getElementById("deleteForm");


            function updateDeleteButton() {

                const selected =
                    Array.from(urlCheckboxes)
                        .filter(checkbox => checkbox.checked);

                deleteButton.disabled =
                    selected.length === 0;
            }


            if (selectAllCheckbox) {

                selectAllCheckbox.addEventListener(
                    "change",
                    function () {

                        urlCheckboxes.forEach(
                            checkbox => {
                                checkbox.checked =
                                    selectAllCheckbox.checked;
                            }
                        );

                        updateDeleteButton();
                    }
                );

            }


            urlCheckboxes.forEach(
                checkbox => {

                    checkbox.addEventListener(
                        "change",
                        function () {

                            const allSelected =
                                Array.from(urlCheckboxes)
                                    .every(
                                        checkbox =>
                                            checkbox.checked
                                    );

                            if (selectAllCheckbox) {
                                selectAllCheckbox.checked =
                                    allSelected;
                            }

                            updateDeleteButton();

                        }
                    );

                }
            );


            deleteButton.addEventListener(
                "click",
                function () {

                    const confirmed =
                        confirm(
                            "Delete the selected URLs? This action cannot be undone."
                        );

                    if (confirmed) {
                        deleteForm.submit();
                    }

                }
            );

        });

    </script>

</div>

</body>
</html>
