<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Create account · Short.</title>
</head>

<body>

<div layout:fragment="content">

    <div class="auth-page">

        <div class="auth-header">

            <h1>Create your account</h1>

            <p>
                Start creating and managing your short links.
            </p>

        </div>


        <div class="auth-card">

            <form
                    th:action="@{/register}"
                    method="post"
                    th:object="${user}">

                <div class="form-group">

                    <label
                            for="name"
                            class="form-label">
                        Full name
                    </label>

                    <input
                            type="text"
                            id="name"
                            class="form-input"
                            th:field="*{name}"
                            autocomplete="name"
                            placeholder="Your name">

                    <div
                            class="field-error"
                            th:if="${#fields.hasErrors('name')}"
                            th:errors="*{name}">
                    </div>

                </div>


                <div class="form-group">

                    <label
                            for="email"
                            class="form-label">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            class="form-input"
                            th:field="*{email}"
                            autocomplete="email"
                            placeholder="you@example.com">

                    <div
                            class="field-error"
                            th:if="${#fields.hasErrors('email')}"
                            th:errors="*{email}">
                    </div>

                </div>


                <div class="form-group">

                    <label
                            for="password"
                            class="form-label">
                        Password
                    </label>

                    <input
                            type="password"
                            id="password"
                            class="form-input"
                            th:field="*{password}"
                            autocomplete="new-password"
                            placeholder="Create a password">

                    <div
                            class="field-error"
                            th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}">
                    </div>

                </div>


                <button
                        type="submit"
                        class="auth-submit">
                    Create account
                </button>

            </form>


            <div class="auth-footer">

                Already have an account?

                <a th:href="@{/login}">
                    Log in
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
